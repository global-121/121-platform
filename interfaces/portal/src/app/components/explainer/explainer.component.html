<div class="bg-grey-100 rounded-lg p-3">
  <p-accordion [value]="null">
    <p-accordion-panel
      value="0"
      [unstyled]="true"
    >
      <p-accordion-header
        [unstyled]="true"
        class="flex cursor-pointer items-start justify-between [&>svg]:self-center"
      >
        <p class="m-0 flex items-center gap-3 font-bold">
          <span
            class="pi pi-question-circle"
            aria-hidden="true"
          ></span>
          <span>
            {{ title() }}
          </span>
        </p>
      </p-accordion-header>

      <p-accordion-content
        class="[&_.p-accordioncontent-content]:bg-transparent [&_.p-accordioncontent-content]:p-0 [&_.p-accordioncontent-content]:ps-6 [&_.p-accordioncontent-content]:pbs-2"
      >
        <ul class="my-2.5 space-y-2.5 [counter-reset:item]">
          @for (item of items(); track $index) {
            <li
              class="before:text-purple relative ps-7.5 before:absolute before:inset-s-0 before:inset-bs-0.75 before:block before:rounded-full before:bg-purple-300 before:text-center before:text-xs/5 before:font-bold before:content-[counter(item)] before:[counter-increment:item] before:block-5 before:inline-5"
            >
              <p>{{ item.content }}</p>

              @if (item.image) {
                <img
                  [src]="item.image.url"
                  class="my-3.5 -ms-7.5 min-inline-[calc(100%+1.875rem)]"
                  [alt]="item.image.alt"
                />
              }
            </li>
          }
        </ul>
      </p-accordion-content>
    </p-accordion-panel>
  </p-accordion>
</div>
