<details
  #details
  class="group bg-grey-100 rounded-lg"
  [open]="expanded()"
  (toggle)="expanded.set(details.open)"
>
  <summary
    class="flex cursor-pointer list-none items-start justify-between p-3 [&::-webkit-details-marker]:hidden"
  >
    <p class="m-0 flex items-center gap-3 font-bold">
      <span
        class="pi pi-question-circle"
        aria-hidden="true"
      ></span>
      <span>
        {{ title() }}
      </span>
    </p>
    <span
      class="pi pi-chevron-down self-center transition-transform group-open:rotate-180"
      aria-hidden="true"
    ></span>
  </summary>

  <div class="p-3 ps-6 pbs-0">
    <ol class="my-2.5 space-y-2.5 [counter-reset:item]">
      @for (item of items(); track $index) {
        <li
          class="before:text-purple relative ps-7.5 before:absolute before:inset-s-0 before:inset-bs-0.75 before:block before:rounded-full before:bg-purple-300 before:text-center before:text-xs/5 before:font-bold before:content-[counter(item)] before:[counter-increment:item] before:block-5 before:inline-5"
        >
          <p>{{ item.content }}</p>

          @if (item.image) {
            <div [style.max-width]="item.image.maxWidth ?? '100%'">
              <img
                [src]="item.image.url"
                class="my-3.5 -ms-7.5 min-inline-[calc(100%+1.5rem)]"
                [alt]="item.image.alt"
              />
            </div>
          }
        </li>
      }
    </ol>
  </div>
</details>
