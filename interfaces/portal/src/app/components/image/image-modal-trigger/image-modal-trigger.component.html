@if (isAvailable()) {
  <app-colored-chip
    label="Available"
    i18n-label="@@image-available"
    variant="green"
  />
} @else {
  <app-colored-chip
    label="Not available"
    i18n-label="@@image-not-available"
    variant="red"
  />
}

@if (isAvailable()) {
  <p-button
    (click)="toggleViewer()"
    class="ms-auto"
    size="small"
    outlined
    rounded
  >
    @if (isOpen()) {
      <span class="pi pi-eye-slash"></span>
      <span i18n="@@image-viewer-hide">Hide</span>
    } @else {
      <span class="pi pi-eye"></span>
      <span i18n="@@image-viewer-show">Show</span>
    }
  </p-button>
}
