@if (showNotice()) {
  <div class="bg-blue-100">
    <div
      class="flex px-4 py-2 align-text-top"
      [ngClass]="contentContainerStyles()"
    >
      <i class="pi pi-wrench me-2 mbs-1"></i>
      <p>
        <strong i18n="@@maintenance-notice-2026-11-title">
          Scheduled maintenance: Friday 4 December, 06:00-20:00 (CET)
        </strong>
        &nbsp;
        <span i18n="@@maintenance-notice-2026-11-content">
          121 will be unavailable while we upgrade the platform. Please plan
          your work around this window.
        </span>
      </p>
    </div>
  </div>
}
