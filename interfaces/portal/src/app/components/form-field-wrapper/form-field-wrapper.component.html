<div
  [attr.data-testid]="dataTestId()"
  class="mbe-2"
>
  <label
    class="block [&_.p-datepicker]:inline-full [&_input]:inline-full [&_textarea]:inline-full"
  >
    <div class="mbe-2 block">
      <span
        class="inline-flex items-center gap-1 align-middle font-bold max-inline-full"
      >
        @if (isRequired()) {
          <span class="me-0">*</span>
        }
        <span class="ms-0">{{ label() | translatableString }}</span>
        @let tooltipData = infoTooltipData();
        @if (tooltipData) {
          <app-info-tooltip
            [infoTooltipData]="tooltipData"
            class="ms-1"
          />
        }
      </span>
      <span class="ms-1 inline-flex items-center align-middle max-inline-full"
        ><ng-content select="[slot='label-extra-inline']"></ng-content
      ></span>
    </div>

    <!-- Additional label text -->
    <div
      class="text-grey-700 hide-when-empty -mbs-1 text-sm/tight! *:mbe-2.5 *:block"
    >
      <ng-content select="[slot='label-extra']"></ng-content>
    </div>
    <ng-content></ng-content>
    <app-form-error [error]="errorMessage()" />
  </label>
  <ng-content select="[slot='details']"></ng-content>
</div>
