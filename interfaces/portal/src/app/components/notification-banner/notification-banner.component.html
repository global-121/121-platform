@if (content()) {
  <div
    class="flex items-center rounded-2xl border p-4 inline-full"
    [ngClass]="[wrapperVariant(), wrapperMarginClass()]"
  >
    @if (content(); as content) {
      @if (iconVariant()) {
        <span
          class="me-2 text-xl"
          [ngClass]="iconVariant()"
        ></span>
      }
      <div class="leading-tight">
        <strong>{{ content.title }}</strong>
        @if (content.description) {
          <span>&nbsp;-&nbsp;</span>
          <span class="text-black">{{ content.description }}</span>
        }
      </div>
    }
  </div>
} @else {
  <div
    class="flex items-center rounded-2xl border p-4 inline-full"
    [ngClass]="[wrapperVariant(), wrapperMarginClass()]"
  >
    <ng-content></ng-content>
  </div>
}
