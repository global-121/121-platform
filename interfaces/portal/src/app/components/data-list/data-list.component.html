<div
  class="grid grid-cols-1 gap-x-5"
  [ngClass]="{
    'md:grid-cols-2': !forceOneColumn(),
  }"
>
  @for (item of data(); track $index) {
    @let edge = itemEdgeFlags()[$index];
    <div
      [attr.data-testid]="item.dataTestId"
      [attr.data-testid-category]="'data-list-item'"
      class="border-grey-300 mbe-3.5 flex flex-col gap-1 border-be pbe-3.5"
      [ngClass]="{
        'col-span-2': item.fullWidth,
        'pbs-3.5': edge.isFirstItem,
        'md:pbs-3.5': edge.isInFirstWideScreenRow,
        'mbe-0! border-be-0!': edge.isLastItem,
        'md:mbe-0! md:border-be-0!': edge.isInLastWideScreenRow,
      }"
    >
      <div class="relative flex items-center">
        <div class="flex flex-1 text-base opacity-65">
          @if (item.type === 'koboImage') {
            <i class="pi pi-image relative inset-bs-1 me-1.5 opacity-80"></i>
          }

          <div>
            {{ item.label | translatableString }}:
            @if (item.infoTooltipData) {
              <app-info-tooltip [infoTooltipData]="item.infoTooltipData" />
            }
          </div>
        </div>

        @if (item.detailAction && !item.loading) {
          <span class="absolute inset-e-0 inset-bs-1/2 -translate-y-1/2">
            <ng-container
              *ngComponentOutlet="
                item.detailAction.component;
                inputs: item.detailAction.inputs
              "
            ></ng-container>
          </span>
        }
      </div>

      <app-data-list-value [item]="item" />
    </div>
  }
</div>
