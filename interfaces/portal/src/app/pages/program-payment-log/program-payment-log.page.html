<app-page-layout-payment
  [programId]="programId()"
  [paymentId]="paymentId()"
>
  <app-query-table
    [items]="paymentEvents()"
    [isPending]="false"
    [columns]="columns()"
    localStorageKey="payment-log-table"
    [tableCellContext]="tableCellContext()"
    [initialSortField]="'created'"
    [initialSortOrder]="-1"
    [dataTestId]="'payment-log-table'"
  />
</app-page-layout-payment>
