<app-card-editable
  header="Finance"
  i18n-header="@@card-title-program-settings-finance"
  editPencilTitle="Edit finance"
  i18n-editPencilTitle
  [canEdit]="canEdit()"
  [(isEditing)]="isEditing"
  [formGroup]="formGroup()"
  [mutation]="updateProgramMutation"
  [trackEventsOnSave]="trackSaveEventPayloads"
  [mutationData]="formGroup()?.getRawValue()"
>
  <p
    i18n
    class="mbe-4"
  >
    Define your program's funds, currency, transfer details and Financial
    Service Providers
  </p>

  @if (!isEditing()) {
    <app-data-list
      [data]="dataListData()"
      data-testid="program-finance-data-list"
    />
  } @else {
    <app-program-form-budget
      #programFormBudget
      [program]="program.data()"
      [programId]="programId()"
      (trackEvent)="handleTrackEvent($event)"
    />
  }
</app-card-editable>
