<app-form-dialog
  #configurationDialog
  [header]="configurationDialogHeader()"
  headerIcon="pi pi-money-bill"
  [formGroup]="formGroup()"
  [mutation]="configureFsp"
  [mutationData]="formGroup().getRawValue()"
  [proceedLabel]="configurationProceedLabel()"
>
  <p
    i18n
    class="mbe-4"
  >
    For more information about how to integrate this FSP see the
    <app-manual-link />.
  </p>

  @switch (fspSetting().name) {
    @case ('Excel') {
      <app-excel-fsp-dialog-content
        [programId]="programId()"
        [formGroup]="formGroup()"
        [fspFormFields]="fspFormFields()"
      />
    }
    @default {
      @for (fspFormField of fspFormFields(); track fspFormField.name) {
        <app-fsp-configuration-property-input
          [programId]="programId()"
          [formGroup]="formGroup()"
          [fspFormField]="fspFormField"
        />
      }
    }
  }
</app-form-dialog>
