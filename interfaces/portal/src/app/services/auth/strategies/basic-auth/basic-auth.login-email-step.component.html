<p
  i18n
  class="mbs-3 mbe-10"
>
  Enter your work email and we'll send you a one-time code.
</p>
<app-form-default
  [formGroup]="formGroup"
  submitButtonText="Send code"
  i18n-submitButtonText
  [mutation]="requestOneTimePasswordMutation"
>
  <app-form-field-wrapper
    label="E-mail"
    i18n-label
    [errorMessage]="formFieldErrors()('email')"
  >
    <!-- eslint-disable @angular-eslint/template/no-autofocus -- THE login-input allows for an exception. -->
    <input
      pInputText
      type="email"
      formControlName="email"
      autocomplete="username"
      placeholder="yourname@example.org"
      i18n-placeholder
      [pAutoFocus]="true"
      autofocus
    />
    <!-- eslint-enable @angular-eslint/template/no-autofocus -- Only this input requires exception. -->
  </app-form-field-wrapper>
</app-form-default>
<p class="mbs-4">
  <p-button
    i18n
    [link]="true"
    (click)="passwordInstead.emit({ email: formGroup.getRawValue().email })"
    >Log in with password instead</p-button
  >
</p>
