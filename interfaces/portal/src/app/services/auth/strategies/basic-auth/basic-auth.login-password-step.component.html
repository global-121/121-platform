<p
  i18n
  class="mbs-3 mbe-10"
>
  Use your work email to log in.
</p>
<app-form-default
  [formGroup]="formGroup"
  submitButtonText="Log in"
  i18n-submitButtonText
  [mutation]="loginMutation"
>
  <app-form-field-wrapper
    label="E-mail"
    i18n-label
    [errorMessage]="formFieldErrors()('email')"
  >
    <input
      pInputText
      type="email"
      formControlName="email"
      autocomplete="username"
      placeholder="yourname@example.org"
      i18n-placeholder
    />
  </app-form-field-wrapper>
  <app-form-field-wrapper
    label="Password"
    i18n-label
    [errorMessage]="formFieldErrors()('password')"
  >
    <p-password
      formControlName="password"
      autocomplete="current-password"
      [toggleMask]="true"
      [feedback]="false"
    />
  </app-form-field-wrapper>
</app-form-default>
<p class="mbs-4">
  <span i18n>Forgot your password?</span>&nbsp;

  <a
    i18n
    [href]="'mailto:support@121.global?subject=' + passWordResetSubject"
    target="_blank"
    >Request a password reset</a
  >
</p>
<p class="mbs-2">
  <p-button
    i18n
    [link]="true"
    (click)="
      oneTimePasswordInstead.emit({ email: formGroup.getRawValue().email })
    "
    >Log in with a one-time code instead</p-button
  >
</p>
