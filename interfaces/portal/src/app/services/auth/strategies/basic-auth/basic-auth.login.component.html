@switch (step()) {
  @case (LoginStep.email) {
    <app-basic-auth-login-email-step
      [email]="email()"
      (oneTimePasswordRequested)="onOneTimePasswordRequested($event)"
      (passwordInstead)="
        goToStep({ step: LoginStep.password, email: $event.email })
      "
    />
  }
  @case (LoginStep.oneTimePassword) {
    @if (oneTimePasswordRequest(); as oneTimePasswordRequest) {
      <app-basic-auth-login-one-time-password-step
        [email]="email()"
        [oneTimePasswordRequestedAt]="oneTimePasswordRequest.requestedAt"
        [returnUrl]="returnUrl()"
        (oneTimePasswordRequested)="onOneTimePasswordRequested($event)"
        (changeEmail)="goToStep({ step: LoginStep.email, email: $event.email })"
        (passwordInstead)="
          goToStep({ step: LoginStep.password, email: $event.email })
        "
      />
    }
  }
  @case (LoginStep.password) {
    <app-basic-auth-login-password-step
      [email]="email()"
      [returnUrl]="returnUrl()"
      (oneTimePasswordInstead)="
        goToStep({ step: LoginStep.email, email: $event.email })
      "
    />
  }
}
