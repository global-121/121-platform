@switch (step()) {
  @case (LoginStep.email) {
    <app-basic-auth-login-email-step
      [email]="email()"
      (otpRequested)="onOtpRequested($event)"
      (passwordInstead)="goToStep({ step: LoginStep.password, email: $event })"
    />
  }
  @case (LoginStep.otp) {
    @if (otpRequest(); as otpRequest) {
      <app-basic-auth-login-otp-step
        [email]="email()"
        [otpRequestedAt]="otpRequest.requestedAt"
        [returnUrl]="returnUrl()"
        (otpRequested)="onOtpRequested($event)"
        (changeEmail)="goToStep({ step: LoginStep.email, email: $event })"
        (passwordInstead)="
          goToStep({ step: LoginStep.password, email: $event })
        "
      />
    }
  }
  @case (LoginStep.password) {
    <app-basic-auth-login-password-step
      [email]="email()"
      [returnUrl]="returnUrl()"
      (otpInstead)="goToStep({ step: LoginStep.email, email: $event })"
    />
  }
}
