name: Build and test energy results
description: Finish Eco CI measurements and preserve native results.

inputs:
  artifact-name:
    description: Unique workflow and matrix producer identifier.
    required: true
  start-outcome:
    description: Outcome of the Eco CI start step.
    required: true
  workload-status:
    description: Job status before collecting measurements.
    required: true
  approximate:
    description: Whether the standard model is being applied to a slim runner.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Sample build and test energy
      id: sample
      if: always() && inputs.start-outcome == 'success'
      continue-on-error: true
      uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
      with:
        task: get-measurement
        label: Build and test
        send-data: false
        json-output: true

    - name: Display Eco CI results
      id: display
      if: always() && inputs.start-outcome == 'success' && steps.sample.outcome == 'success'
      continue-on-error: true
      uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
      with:
        task: display-results
        send-data: false
        display-badge: false
        pr-comment: false
        json-output: true

    - name: Record measurement status
      id: status
      if: always()
      continue-on-error: true
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ENERGY_PRODUCER: ${{ inputs.artifact-name }}
        ENERGY_START: ${{ inputs.start-outcome }}
        ENERGY_SAMPLE: ${{ steps.sample.outcome }}
        ENERGY_DISPLAY: ${{ steps.display.outcome }}
        ENERGY_WORKLOAD: ${{ inputs.workload-status }}
        ENERGY_APPROXIMATE: ${{ inputs.approximate }}
      run: node tools/eco-ci-summary.mjs record

    - name: Preserve native Eco CI output
      id: upload
      if: always() && steps.status.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: eco-ci-${{ inputs.artifact-name }}-attempt-${{ github.run_attempt }}
        path: |
          /tmp/eco-ci/lap-data.json
          /tmp/eco-ci/output.txt
          /tmp/eco-ci/measurement-status.json
        if-no-files-found: error
        retention-days: 30

    - name: Warn about missing measurements
      if: always() && (inputs.start-outcome != 'success' || steps.sample.outcome != 'success' || steps.display.outcome != 'success' || steps.status.outcome != 'success' || steps.upload.outcome != 'success')
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        echo "::warning::Eco CI measurements are incomplete. Existing build/test results are unchanged."
        echo "### Eco CI: incomplete measurement" >> "$GITHUB_STEP_SUMMARY"
