# See: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment

name: 'Copilot Setup Steps'

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Start build and test energy measurement
        id: energy_start
        continue-on-error: true
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: start-measurement
          send-data: false
          json-output: true

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
            packages/eslint-config-121-platform/package-lock.json
            interfaces/portal/package-lock.json
            services/121-service/package-lock.json
            services/mock-service/package-lock.json

      - name: Install root dependencies
        working-directory: './'
        env:
          HUSKY: 0
        run: npm ci --ignore-scripts

      - name: Install shared ESLint-config dependencies
        working-directory: './packages/eslint-config-121-platform'
        run: npm ci --ignore-scripts

      - name: Install E2E-Test dependencies
        working-directory: './e2e'
        run: npm ci --ignore-scripts

      - name: Install Portal dependencies
        working-directory: './interfaces/portal'
        run: npm ci --ignore-scripts

      - name: Install 121-Service dependencies
        working-directory: './services/121-service'
        run: npm ci --ignore-scripts

      - name: Install Mock-Service dependencies
        working-directory: './services/mock-service'
        run: npm ci --ignore-scripts

      - name: Collect build and test energy
        if: always()
        continue-on-error: true
        uses: ./.github/actions/energy-results
        with:
          artifact-name: copilot-setup-steps-copilot-setup-steps
          start-outcome: ${{ steps.energy_start.outcome }}
          workload-status: ${{ job.status }}
          approximate: 'false'

      - name: Prepare ENV-variables
        run: |
          cp services/.env.example services/.env
          grep -v "^#\|^$" services/.env.example >> $GITHUB_ENV
          cp interfaces/portal/.env.example interfaces/portal/.env
          grep -v "^#\|^$" interfaces/portal/.env >> $GITHUB_ENV

  energy-summary:
    name: Build and test energy total
    if: always()
    needs: [copilot-setup-steps]
    runs-on: ubuntu-slim
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Summarize build and test energy
        uses: ./.github/actions/energy-summary
        with:
          workflow: copilot-setup-steps
          producers: '["copilot-setup-steps-copilot-setup-steps"]'
          job-results: ${{ toJSON(needs) }}
