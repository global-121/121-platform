# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: 'Test Interface: Portal'

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths:
      - .github/workflows/test_interface_portal.yml
      - interfaces/portal/**
      - services/121-service/** # 121-service's code is imported/used
      - '!**.md'
  push:
    branches:
      - main
    paths:
      - .github/workflows/test_interface_portal.yml
      - interfaces/portal/**
      - services/121-service/** # 121-service's code is imported/used
      - '!**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This is needed for Qlty to authenticate with OIDC
# https://docs.qlty.sh/coverage/quickstart#github-actions
permissions:
  contents: read
  id-token: write

env:
  interfacePath: interfaces/portal

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Start build and test energy measurement
        id: energy_start
        continue-on-error: true
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: start-measurement
          send-data: false
          json-output: true

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: '${{ env.interfacePath }}/.node-version'
          cache: 'npm'
          cache-dependency-path: '${{ env.interfacePath }}/package-lock.json'

      - name: Install
        working-directory: ${{ env.interfacePath }}
        run: 'npm ci'

      - name: 'Test: Types'
        working-directory: ${{ env.interfacePath }}
        run: 'npm run typecheck'

      - name: Lint
        working-directory: ${{ env.interfacePath }}
        run: 'npm run lint'

      - name: Check for dead code
        working-directory: ${{ env.interfacePath }}
        run: 'npm run knip'

      - name: 'Test: Deployment Configuration'
        working-directory: ${{ env.interfacePath }}
        run: |
          cp -vf .env.example .env
          npm run build:deployment-configuration
          npm run test:deployment-configuration

      - name: 'Test: Code'
        working-directory: ${{ env.interfacePath }}
        run: 'npm run test:coverage'

      - name: 'Check translations output-file'
        working-directory: ${{ env.interfacePath }}
        run: |
          npm run set-env-variables -- --env=development
          npm run extract-i18n
          git diff --exit-code src/locale/messages.xlf

      - name: Collect build and test energy
        if: always()
        continue-on-error: true
        uses: ./.github/actions/energy-results
        with:
          artifact-name: test_interface_portal-test
          start-outcome: ${{ steps.energy_start.outcome }}
          workload-status: ${{ job.status }}
          approximate: 'false'

      - name: 'Upload coverage report to QLTY'
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506
        with:
          oidc: true
          add-prefix: ${{ env.interfacePath }}
          tag: portal
          files: ${{ env.interfacePath }}/coverage/portal/lcov.info

      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            ${{ env.interfacePath }}/coverage

  energy-summary:
    name: Build and test energy total
    if: always()
    needs: [test]
    runs-on: ubuntu-slim
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Summarize build and test energy
        uses: ./.github/actions/energy-summary
        with:
          workflow: test_interface_portal
          producers: '["test_interface_portal-test"]'
          job-results: ${{ toJSON(needs) }}
