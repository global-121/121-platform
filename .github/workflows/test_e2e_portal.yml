# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

# Can't use the top-level "paths" filter because of issues with required checks
# See: https://github.com/orgs/community/discussions/44490#discussioncomment-10253645

name: 'Test: E2E (Portal)'

on:
  workflow_dispatch:
    inputs:
      repeat_count:
        description: 'Number of repetitions per test when hunting flaky tests'
        type: string
        default: '90'
  merge_group:
    types: [checks_requested]
  pull_request:
    types: # See: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
      - opened
      - ready_for_review
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  e2eTestsPath: './e2e'

jobs:
  path-filter:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      should_skip: ${{ steps.filter.outputs.should_skip }}
    steps:
      - uses: actions/checkout@v7
        # Other events (from the merge-queue) can safely ignore the path-filter; Its output would default to 'NOT true'
        if: github.event_name == 'pull_request'
        with:
          filter: blob:none # Reduce clone size/speed
          fetch-depth: 0 # Full history is needed to determine the "changed files in this PR"

      - uses: leavesster/pull-request-path-filter@v0.2
        # Other events (from the merge-queue) can safely ignore the path-filter; Its output would default to 'NOT true'
        if: github.event_name == 'pull_request'
        id: filter
        with:
          paths: |
            - '.github/workflows/test_e2e_portal.yml'
            - '.github/actions/e2e-environment/**'
            - '.github/actions/e2e-collect-results/**'
            - 'e2e/**'
            - 'services/.env.example'
            - 'services/**'
            - '!services/**.test.ts'
            - '!services/**.spec.ts'
            - 'interfaces/portal/**'
            - '!interfaces/portal/**.test.ts'
            - '!interfaces/portal/**.spec.ts'
            - '!**.md'

  lint-code:
    needs: path-filter
    runs-on: ubuntu-latest
    if: ${{ needs.path-filter.outputs.should_skip != 'true' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: '${{ env.e2eTestsPath }}/.node-version'
          cache: 'npm'
          cache-dependency-path: '${{ env.e2eTestsPath }}/package-lock.json'

      - name: Install E2E-Tests code-dependencies
        working-directory: ${{ env.e2eTestsPath }}
        run: |
          npm ci

      - name: Lint E2E-Tests code
        working-directory: ${{ env.e2eTestsPath }}
        run: 'npm run lint'

  detect-flaky-candidates:
    needs: path-filter
    runs-on: ubuntu-latest
    if: ${{ needs.path-filter.outputs.should_skip != 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    outputs:
      files: ${{ steps.select.outputs.files }}
      has_candidates: ${{ steps.select.outputs.has_candidates }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          filter: blob:none # Reduce clone size/speed
          fetch-depth: 0 # Full history is needed to diff against the base commit

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: '${{ env.e2eTestsPath }}/.node-version'

      - name: Determine base commit for flaky-candidate selection
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.ref }}"
          else
            # Manual runs have no PR base, so diff against the default branch instead.
            base_ref="${{ github.event.repository.default_branch }}"
          fi
          # Merge-base (not the branch tip) avoids treating base-branch commits
          # made after this branch diverged as changes introduced by this PR.
          echo "sha=$(git merge-base "origin/$base_ref" HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select changed/new E2E spec files for flaky-test detection
        id: select
        run: |
          node tools/select-changed-e2e-tests.mjs --base ${{ steps.base.outputs.sha }} --head ${{ github.sha }}

  build-e2e-environment:
    needs:
      - path-filter
      - lint-code
    runs-on: ubuntu-latest
    if: ${{ needs.path-filter.outputs.should_skip != 'true' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: './interfaces/portal/.node-version'
          cache: 'npm'
          cache-dependency-path: './interfaces/portal/package-lock.json'

      - name: Set ENV-variables for test-environment
        run: |
          cp services/.env.example services/.env

      - name: Build Services with Docker
        run: |
          npm run install:services

      - name: Export built Docker images
        working-directory: ./services
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-docker-images"
          mapfile -t images < <(docker compose --file=docker-compose.yml config --format json | jq -r '.services[] | select(.build) | .image')
          docker save "${images[@]}" | gzip --fast > "$RUNNER_TEMP/e2e-docker-images/images.tar.gz"

      - name: Upload built Docker images
        uses: actions/upload-artifact@v7
        with:
          name: e2e-docker-images
          path: ${{ runner.temp }}/e2e-docker-images/images.tar.gz
          compression-level: 0 # Already compressed
          retention-days: 1

      - name: Build Portal
        working-directory: ./interfaces/portal
        env:
          NG_PRODUCTION: true
          NG_URL_121_SERVICE_API: http://localhost:3000/api
          NG_DOWNLOAD_TRANSLATIONS_AT_BUILD: false
        run: |
          npm ci
          cp .env.example .env
          npm run build:production

      - name: Upload built Portal
        uses: actions/upload-artifact@v7
        with:
          name: e2e-portal-build
          path: ./interfaces/portal/www/
          retention-days: 1

  find-flaky-changed-tests:
    runs-on: ubuntu-latest
    needs:
      - path-filter
      - lint-code
      - detect-flaky-candidates
      - build-e2e-environment
    if: ${{ needs.detect-flaky-candidates.outputs.has_candidates == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.detect-flaky-candidates.outputs.files) }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Start E2E-Tests environment
        uses: ./.github/actions/e2e-environment
        with:
          e2eTestsPath: ${{ env.e2eTestsPath }}

      - name: Find flaky tests in changed/new E2E spec file(s)
        working-directory: ${{ env.e2eTestsPath }}
        env:
          # Passed via env (not inlined into the script) since SPEC_FILE originates from PR file paths and must never be interpreted by the shell.
          SPEC_FILE: ${{ matrix.file }}
          REPEAT_COUNT: ${{ github.event.inputs.repeat_count || '90' }}
        run: |
          npm test -- "$SPEC_FILE" --fail-on-flaky-tests --repeat-each "$REPEAT_COUNT" -x --trace retain-on-failure --reporter=html

      - name: Collect E2E-Tests results
        if: always()
        uses: ./.github/actions/e2e-collect-results
        with:
          artifactName: test-result-artifacts-flaky-${{ strategy.job-index }}
          e2eTestsPath: ${{ env.e2eTestsPath }}

  test-shard-e2e:
    runs-on: ubuntu-latest
    needs:
      - path-filter
      - lint-code
      - build-e2e-environment
    if: ${{ needs.path-filter.outputs.should_skip != 'true' }}
    strategy:
      # ONLY on the merge-queue, cancel test-runs that will not 'help' the PR get merged; Preventing (some) useless runs.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        shard: ['1', '2', '3', '4', '5', '6']
        shardCount: ['6']

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Start E2E-Tests environment
        uses: ./.github/actions/e2e-environment
        with:
          e2eTestsPath: ${{ env.e2eTestsPath }}

      - name: Run E2E-Tests with Playwright
        working-directory: ${{ env.e2eTestsPath }}
        run: |
          npm test -- --shard=${{ matrix.shard }}/${{ matrix.shardCount }}

      - name: Collect E2E-Tests results
        if: always()
        uses: ./.github/actions/e2e-collect-results
        with:
          artifactName: test-result-artifacts-${{ matrix.shard }}
          e2eTestsPath: ${{ env.e2eTestsPath }}

  # This job is here to make the above jobs "required" in GitHub.
  # This is a workaround for this issue: https://github.com/orgs/community/discussions/44490
  test-shard-resolution-e2e:
    runs-on: ubuntu-slim
    needs:
      - path-filter
      - lint-code
      - detect-flaky-candidates
      - build-e2e-environment
      - test-shard-e2e
      - find-flaky-changed-tests
    if: always()
    steps:
      - name: Check required job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Some checks have failed." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check required job results
        if: contains(needs.*.result, 'failure') != 'true' || contains(needs.*.result, 'cancelled') != 'true'
        run: |
          echo "All required checks have successfully passed." >> "$GITHUB_STEP_SUMMARY"
          exit 0
