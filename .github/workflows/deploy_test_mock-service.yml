# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# Also, see: https://github.com/Azure/actions-workflow-samples

name: 'Deploy [test] Mock-Service'

# ⚠️
# Keep in sync with: https://github.com/global-121/infrastructure/blob/main/.github/workflows/deploy_test_mock-service.yml
#

env:
  AZURE_WEBAPP_NAME: '121-mock-test'
  AZURE_WEBAPP_PACKAGE_PATH: services/mock-service

defaults:
  run:
    working-directory: services/mock-service

permissions:
  actions: read
  deployments: write

on:
  workflow_call:
    secrets:
      AZURE_WEBAPP_PUBLISH_PROFILE_MOCK_SERVICE:
        required: true
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy_test_mock-service.yml'
      - 'services/mock-service/**'
      - '!*.md'
      - '!*.yml'

jobs:
  build-and-deploy:
    name: Build and Deploy
    environment: 'test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Start build and test energy measurement
        id: energy_start
        continue-on-error: true
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: start-measurement
          send-data: false
          json-output: true

      - name: Build Service
        id: build
        uses: ./.github/actions/build-service
        with:
          servicePath: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Collect build and test energy
        if: always()
        continue-on-error: true
        uses: ./.github/actions/energy-results
        with:
          artifact-name: deploy_test_mock-service-build-and-deploy
          start-outcome: ${{ steps.energy_start.outcome }}
          workload-status: ${{ job.status }}
          approximate: 'false'

      - name: Deploy to Azure App Service
        id: deploy_to_aas
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_MOCK_SERVICE }}
          package: '${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/artifact.zip'
          type: zip
          clean: true

      - name: Finish
        run: |
          echo "Build version: ${{ steps.build.outputs.build_version }}" >> $GITHUB_STEP_SUMMARY
          echo "Preview: <${{ steps.deploy_to_aas.outputs.webapp-url }}>" >> $GITHUB_STEP_SUMMARY

  energy-summary:
    name: Build and test energy total
    if: always()
    needs: [build-and-deploy]
    runs-on: ubuntu-slim
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Summarize build and test energy
        uses: ./.github/actions/energy-summary
        with:
          workflow: deploy_test_mock-service
          producers: '["deploy_test_mock-service-build-and-deploy"]'
          job-results: ${{ toJSON(needs) }}
