# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: 'Test: Formatting (with Prettier)'

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths:
      - '.github/workflows/test_formatting.yml'
      - '**.md'
      - '**.json'
      - '**.yml'
      - '**.scss'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  test:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7

      - name: Start build and test energy measurement
        id: energy_start
        continue-on-error: true
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: start-measurement
          send-data: false
          json-output: true

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install
        run: 'npm ci'

      - name: Lint
        run: 'npm run test:prettier'

      - name: Collect build and test energy
        if: always()
        continue-on-error: true
        uses: ./.github/actions/energy-results
        with:
          artifact-name: test_formatting-test
          start-outcome: ${{ steps.energy_start.outcome }}
          workload-status: ${{ job.status }}
          approximate: 'true'

  energy-summary:
    name: Build and test energy total
    if: always()
    needs: [test]
    runs-on: ubuntu-slim
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Summarize build and test energy
        uses: ./.github/actions/energy-summary
        with:
          workflow: test_formatting
          producers: '["test_formatting-test"]'
          job-results: ${{ toJSON(needs) }}
