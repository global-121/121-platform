# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: 'Test: Workflows'

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'tools/eco-ci-summary*.mjs'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7

      - name: Start build and test energy measurement
        id: energy_start
        continue-on-error: true
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: start-measurement
          send-data: false
          json-output: true

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Test Eco CI workflow totals
        run: node --test tools/eco-ci-summary.test.mjs

      - name: Lint GitHub Action workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          group-result: false
          shellcheck: true
          pyflakes: false
          flags: '-ignore SC2086'

      - name: Lint .env files
        uses: dotenv-linter/action-dotenv-linter@afde61cfda2ecffe7bea35837b6f20b956c88689
        with:
          reporter: github-code-suggestions
          dotenv_linter_flags: --ignore-checks UnorderedKey

      - name: Collect build and test energy
        if: always()
        continue-on-error: true
        uses: ./.github/actions/energy-results
        with:
          artifact-name: test_workflows-test
          start-outcome: ${{ steps.energy_start.outcome }}
          workload-status: ${{ job.status }}
          approximate: 'true'

  energy-summary:
    name: Build and test energy total
    if: always()
    needs: [test]
    runs-on: ubuntu-slim
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Summarize build and test energy
        uses: ./.github/actions/energy-summary
        with:
          workflow: test_workflows
          producers: '["test_workflows-test"]'
          job-results: ${{ toJSON(needs) }}
