name: 'Test: Jest Performance Tests Cronjob'

on:
  schedule:
    - cron: '42 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

env:
  workingDirectory: services/121-service
  EXTERNAL_121_SERVICE_URL: http://localhost:3000

jobs:
  generate-test-files:
    runs-on: ubuntu-latest
    outputs:
      shard1_files: ${{ steps.discover.outputs.shard1_files }}
      long_test_1: ${{ steps.discover.outputs.long_test_1 }}
      long_test_2: ${{ steps.discover.outputs.long_test_2 }}
      long_test_3: ${{ steps.discover.outputs.long_test_3 }}
      long_test_4: ${{ steps.discover.outputs.long_test_4 }}
      long_test_5: ${{ steps.discover.outputs.long_test_5 }}
      long_test_6: ${{ steps.discover.outputs.long_test_6 }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up test files per shard
        id: discover
        run: |
          # 90 min timeout, 131k registrations (2^17), IntersolveVisa has the most complex FSP logic and most API calls
          LONG_TEST_1="payment-100k-registration-intersolve-visa.test.ts"

          # 90 min timeout, 32k registrations (2^15), measures system performance while a payment is running (export + bulk message during payment)
          LONG_TEST_2="performance-during-payment.test.ts"

          # 10 min timeout, 131k registrations (2^17), duplicates query is CPU/memory-intensive; isolated so it doesn't inherit resource pressure from other tests
          LONG_TEST_3="find-duplicates-100k-registrations.test.ts"

          # 10 min timeout, imports 1000 registrations via CSV, relatively quick but still slow enough to warrant its own shard
          LONG_TEST_4="import-1000-registrations.test.ts"

          # 5 min timeout, exports 131k registrations (2^17), resource-heavy export operation that destabilizes other tests running alongside it
          LONG_TEST_5="export-100k-registrations-ocw.test.ts"

          # 90 min timeout, 131k registrations (2^17), Safaricom uses callbacks making it heavier/more complex than simpler FSPs
          LONG_TEST_6="payment-100k-registration-safaricom.test.ts"

          SHARD1_FILES=$(find services/121-service/test/performance -name '*.test.ts' ! -name "$LONG_TEST_1" ! -name "$LONG_TEST_2" ! -name "$LONG_TEST_3" ! -name "$LONG_TEST_4" ! -name "$LONG_TEST_5" ! -name "$LONG_TEST_6" -print0 | xargs -0 -n1 basename | sort | xargs | tr ' ' ',')
          {
            echo "shard1_files=$SHARD1_FILES"
            echo "long_test_1=$LONG_TEST_1"
            echo "long_test_2=$LONG_TEST_2"
            echo "long_test_3=$LONG_TEST_3"
            echo "long_test_4=$LONG_TEST_4"
            echo "long_test_5=$LONG_TEST_5"
            echo "long_test_6=$LONG_TEST_6"
          } >> "$GITHUB_OUTPUT"

  performance-test-shard:
    runs-on: ubuntu-latest
    needs: [generate-test-files]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
        include:
          - shard: 1
            test_files: ${{ needs.generate-test-files.outputs.shard1_files }}
          - shard: 2
            test_files: ${{ needs.generate-test-files.outputs.long_test_1 }}
          - shard: 3
            test_files: ${{ needs.generate-test-files.outputs.long_test_2 }}
          - shard: 4
            test_files: ${{ needs.generate-test-files.outputs.long_test_3 }}
          - shard: 5
            test_files: ${{ needs.generate-test-files.outputs.long_test_4 }}
          - shard: 6
            test_files: ${{ needs.generate-test-files.outputs.long_test_5 }}
          - shard: 7
            test_files: ${{ needs.generate-test-files.outputs.long_test_6 }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: '${{ env.workingDirectory }}/.node-version'
          cache: 'npm'
          cache-dependency-path: '${{ env.workingDirectory }}/package-lock.json'

      - name: Set ENV-variables for test-environment
        run: |
          cp ./services/.env.example services/.env
          grep -v "^#\|^$" services/.env.example >> "$GITHUB_ENV"

      - name: Run Services with Docker
        run: |
          npm run start:services:ci

      - name: Run performance tests - Shard ${{ matrix.shard }}
        working-directory: ${{ env.workingDirectory }}
        run: |
          IFS=',' read -ra TESTS <<< "${{ matrix.test_files }}"

          for test_file in "${TESTS[@]}"; do
            if [[ -n "$test_file" ]]; then
              docker compose exec -e CI=true -e HIGH_DATA_VOLUME=true -e GITHUB_WORKFLOW="${{ github.workflow }}" 121-service npm run test:integration:base -t "$test_file"
            fi
          done

      - name: Docker logs
        if: always()
        uses: global-121/collect-container-logs@78594c6154439e32858bf3dc17c9ff36561a1d31

  performance-test-shard-resolution:
    runs-on: ubuntu-slim
    needs:
      - performance-test-shard
    if: always()
    steps:
      - name: Check test results - FAILURE
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Performance tests have failed." >> "$GITHUB_STEP_SUMMARY"
          echo "Test results: ${{ toJson(needs.*.result) }}" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check test results - SUCCESS
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: |
          echo "All performance tests have successfully passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Test results: ${{ toJson(needs.*.result) }}" >> "$GITHUB_STEP_SUMMARY"
