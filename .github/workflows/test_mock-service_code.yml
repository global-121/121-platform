# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: 'Test Mock-Service: Code'

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths:
      - '.github/workflows/test_mock-service_code.yml'
      - '.github/actions/build-service/action.yml'
      - 'services/mock-service/**'
      - '!**.md'
  push:
    branches:
      - 'release/*'
      - 'hotfix/*'
    paths:
      - '.github/workflows/test_mock-service_code.yml'
      - '.github/actions/build-service/action.yml'
      - 'services/mock-service/**'
      - '!**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  workingDirectory: 'services/mock-service'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Start build and test energy measurement
        id: energy_start
        continue-on-error: true
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: start-measurement
          send-data: false
          json-output: true

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          # See supported Node.js versions: https://github.com/Azure/app-service-linux-docs/blob/master/Runtime_Support/node_support.md
          node-version-file: '${{ env.workingDirectory }}/.node-version'
          cache: 'npm'
          cache-dependency-path: '${{ env.workingDirectory }}/package-lock.json'

      - name: Install
        working-directory: ${{ env.workingDirectory }}
        run: 'npm ci'

      - name: Lint
        working-directory: ${{ env.workingDirectory }}
        run: 'npm run lint'

      - name: Check for TS errors
        working-directory: ${{ env.workingDirectory }}
        run: 'npm run typecheck'

      - name: Test
        working-directory: ${{ env.workingDirectory }}
        run: 'npm run test'

      - name: Collect build and test energy
        if: always()
        continue-on-error: true
        uses: ./.github/actions/energy-results
        with:
          artifact-name: test_mock-service_code-test
          start-outcome: ${{ steps.energy_start.outcome }}
          workload-status: ${{ job.status }}
          approximate: 'false'

  energy-summary:
    name: Build and test energy total
    if: always()
    needs: [test]
    runs-on: ubuntu-slim
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Summarize build and test energy
        uses: ./.github/actions/energy-summary
        with:
          workflow: test_mock-service_code
          producers: '["test_mock-service_code-test"]'
          job-results: ${{ toJSON(needs) }}
