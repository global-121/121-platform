# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: 'Test Service: Restart Service (ONLY)'

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: # See: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - .github/workflows/test_service_only_restart.yml
      - .github/actions/build-service/action.yml
      - services/.env.example
      - services/121-service/**
      - '!**.md'
  push:
    branches:
      - main
    paths:
      - .github/workflows/test_service_only_restart.yml
      - .github/actions/build-service/action.yml
      - services/.env.example
      - services/121-service/**
      - '!**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  workingDirectory: services/121-service

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Start build and test energy measurement
        id: energy_start
        continue-on-error: true
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: start-measurement
          send-data: false
          json-output: true

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: '${{ env.workingDirectory }}/.node-version'
          cache: 'npm'
          cache-dependency-path: '${{ env.workingDirectory }}/package-lock.json'

      - name: Set ENV-variables for test-environment
        run: |
          cp ./services/.env.example services/.env
          grep -v "^#\|^$" services/.env.example >> "$GITHUB_ENV"

      - name: Install
        working-directory: ${{ env.workingDirectory }}
        run: |
          npm ci

      - name: Run Services with Docker
        run: |
          npm run start:services:ci:production

      - name: 'Run "Restart Service"-test only (outside of Docker-container)'
        working-directory: ${{ env.workingDirectory }}
        run: |
          npm run test:integration:only-restart-service

      - name: Collect build and test energy
        if: always()
        continue-on-error: true
        uses: ./.github/actions/energy-results
        with:
          artifact-name: test_service_only_restart-test
          start-outcome: ${{ steps.energy_start.outcome }}
          workload-status: ${{ job.status }}
          approximate: 'false'

      - name: Docker logs
        if: always()
        uses: global-121/collect-container-logs@78594c6154439e32858bf3dc17c9ff36561a1d31

  energy-summary:
    name: Build and test energy total
    if: always()
    needs: [test]
    runs-on: ubuntu-slim
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Summarize build and test energy
        uses: ./.github/actions/energy-summary
        with:
          workflow: test_service_only_restart
          producers: '["test_service_only_restart-test"]'
          job-results: ${{ toJSON(needs) }}
